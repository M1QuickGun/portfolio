<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume · Storm Wassel</title>
  <!-- Source for resume.pdf. Content comes from content.js; build with: node build-resume.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    @page { size: Letter; margin: 0.4in 0.6in; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #000; font: 11pt/1.13 Carlito, Calibri, Arial, sans-serif; }
    main { max-width: 7.3in; margin: 0 auto; }
    @media screen { body { background: #eee; } main { background: #fff; padding: 0.5in 0.6in; margin: 24px auto; max-width: 8.5in; } }
    a { color: #467886; font-weight: 700; }
    header { text-align: center; margin-bottom: 6pt; }
    h1 { font-size: 16pt; margin: 0; letter-spacing: 0.02em; }
    header p { margin: 0; font-size: 12pt; }
    h2 { font-size: 12.5pt; margin: 4pt 0 0; }
    h2:first-of-type { margin-top: 0; }
    p { margin: 0; }
    ul { margin: 0; padding-left: 0.5in; }
    li { padding-left: 0.05in; }
    .entry { break-inside: avoid; }
  </style>
</head>
<body>
  <main id="resume"></main>
  <script src="content.js"></script>
  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const bare = url => url.replace(/^https?:\/\/(www\.)?/, "");
    const list = items => items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>` : "";
    const R = RESUME, L = SITE.links;

    const education = R.education.map(e => `<div class="entry">
      <p><b>${esc(e.school)}</b>, ${esc(e.place)}</p>
      ${e.degrees.map(d => `<p><i>${esc(d.degree)}</i>, ${esc(d.detail)}</p>${list(d.bullets.map(esc))}`).join("")}
    </div>`).join("");

    const projects = PROJECTS.filter(p => p.resume)
      .map(p => `<b>${esc(p.title)} (${esc(p.resume.stack)}):</b> ${esc(p.resume.line)}`);

    const work = R.work.map(w => `<div class="entry">
      <p><b>${esc(w.org)}</b>, ${esc(w.place)}</p>
      <p><i>${esc(w.role)}</i>, ${esc(w.when)}</p>
      ${list(w.bullets.map(esc))}
    </div>`).join("");

    document.getElementById("resume").innerHTML = `
      <header>
        <h1>${esc(SITE.name.toUpperCase())}</h1>
        <p>${esc(R.tagline)}</p>
        <p><a href="mailto:${esc(L.email)}">${esc(L.email)}</a> <b>| ${esc(R.location)}</b></p>
        <p><a href="${esc(R.website)}">${esc(bare(R.website))}</a> <b>|</b> <a href="${esc(L.linkedin)}">${esc(bare(L.linkedin))}</a></p>
      </header>
      <h2>Summary</h2><p>${esc(R.summary)}</p>
      <h2>Education</h2>${education}
      <h2>Academic Projects</h2>${list(R.academicProjects.map(esc))}
      <h2>Technical Projects</h2>${list(projects)}
      <h2>Skills</h2>${list(R.skills.map(([k, v]) => `${esc(k)}: ${esc(v)}`))}
      <h2>Work Experience</h2>${work}
      <h2>Campus Involvement &amp; Leadership</h2>
      ${R.involvement.map(([k, v]) => `<p><b>${esc(k)}</b>: ${esc(v)}</p>`).join("")}
    `;
    document.fonts.ready.then(() => document.body.dataset.ready = "1");
  </script>
</body>
</html>
